<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Тінь Гірана</title>

<style>

:root{
  --paper:#f4ead5;
  --text:#2a241d;
  --panel:#16120d;
  --gold:#d4af37;
  --font:22px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0f0b07;
  color:var(--text);
  font-family:Georgia, serif;
}

.topbar{
  height:70px;
  background:var(--panel);

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 20px;

  border-bottom:1px solid rgba(212,175,55,.2);
}

.book-name{
  color:var(--gold);
  font-weight:bold;
}

.controls{
  display:flex;
  gap:10px;
}

.controls button{
  width:48px;
  height:48px;

  background:none;

  border:1px solid rgba(212,175,55,.4);

  color:var(--gold);

  border-radius:10px;

  cursor:pointer;
}

.reader{
  padding:35px;
}

.book{
  max-width:1400px;
  margin:auto;

  background:var(--paper);

  border-radius:12px;

  overflow:hidden;

  display:grid;
  grid-template-columns:1fr 1fr;
}

.page{

  min-height:800px;

  padding:70px;

  font-size:var(--font);

  line-height:1.9;
}

.page:first-child{
  border-right:1px solid rgba(0,0,0,.08);
}

.chapter-title{
  font-size:52px;

  line-height:1.3;

  margin-bottom:50px;
}

@media(max-width:900px){

.book{
  grid-template-columns:1fr;
}

.page:first-child{
  border-right:none;
  border-bottom:1px solid rgba(0,0,0,.08);
}

.page{
  padding:35px;
  min-height:auto;
}

.chapter-title{
  font-size:38px;
}

}

</style>
</head>

<body>

<div class="topbar">

<div class="book-name">
Тінь Гірана
</div>

<div class="controls">

<button onclick="decreaseFont()">A-</button>
<button onclick="increaseFont()">A+</button>

</div>

</div>

<div class="reader">

<div class="book">

<div class="page">

<h1 class="chapter-title">
Глава 1. Порожні місця за столом
</h1>

<p>
Тут буде ліва сторінка книги.
</p>

</div>

<div class="page">

<p>
Тут буде права сторінка книги.
</p>

</div>

</div>

</div>

<script>

function increaseFont(){

  const root=document.documentElement;

  let size=parseInt(
      getComputedStyle(root)
      .getPropertyValue('--font')
  );

  size+=2;

  root.style.setProperty('--font',size+'px');
}

function decreaseFont(){

  const root=document.documentElement;

  let size=parseInt(
      getComputedStyle(root)
      .getPropertyValue('--font')
  );

  size=Math.max(16,size-2);

  root.style.setProperty('--font',size+'px');
}

</script>

</body>
</html>
