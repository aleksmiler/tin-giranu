<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Читання книги</title>

<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

<style>
body{
    margin:0;
    padding:0;
    background:#111;
    color:#eee;
    font-family:Georgia, serif;
}

#toolbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    background:#1b1b1b;
    padding:10px;
    display:flex;
    gap:10px;
    justify-content:center;
    border-bottom:1px solid #333;
    z-index:1000;
}

button{
    background:#6c5ce7;
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#5849c9;
}

#content{
    max-width:900px;
    margin:70px auto 50px;
    padding:20px;
    line-height:1.8;
    font-size:20px;
}

img{
    max-width:100%;
}

h1,h2,h3{
    color:white;
}

::-webkit-scrollbar{
    width:10px;
}

::-webkit-scrollbar-thumb{
    background:#555;
}
</style>
</head>

<body>

<div id="toolbar">
    <button onclick="changeFont(-2)">A−</button>
    <button onclick="changeFont(2)">A+</button>
    <button onclick="savePosition()">💾 Зберегти</button>
</div>

<div id="content">
    Завантаження книги...
</div>

<script>

let content = document.getElementById("content");

let fontSize =
Number(localStorage.getItem("fontSize")) || 20;

content.style.fontSize = fontSize + "px";

function changeFont(step){

    fontSize += step;

    if(fontSize < 14) fontSize = 14;
    if(fontSize > 42) fontSize = 42;

    content.style.fontSize =
    fontSize + "px";

    localStorage.setItem(
        "fontSize",
        fontSize
    );
}

function savePosition(){
    localStorage.setItem(
        "bookScroll",
        window.scrollY
    );
}

window.addEventListener(
    "scroll",
    () => {
        localStorage.setItem(
            "bookScroll",
            window.scrollY
        );
    }
);

fetch("books/tin-giranu.docx")
.then(res => res.arrayBuffer())
.then(arrayBuffer => {

    mammoth.convertToHtml({
        arrayBuffer: arrayBuffer
    })

    .then(result => {

        content.innerHTML =
        result.value;

        let savedPosition =
        localStorage.getItem(
            "bookScroll"
        );

        if(savedPosition){

            setTimeout(() => {

                window.scrollTo(
                    0,
                    parseInt(savedPosition)
                );

            },500);

        }

    });

})
.catch(err => {

    content.innerHTML =
    "<h2>Помилка завантаження книги</h2><p>Перевірте файл books/tin-giranu.docx</p>";

    console.error(err);

});

</script>

</body>
</html>
