<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тіні Гірану</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            max-width: 700px;
            padding: 30px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        p {
            color: #aaaaaa;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            background: #6c5ce7;
            color: white;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 12px;
            font-size: 18px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #5849c9;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Тіні Гірану</h1>

    <p>
        Онлайн-читання книги.
        Позиція читання зберігається автоматично.
    </p>

    <a href="reader.html" class="btn">
        📖 Почати читати
    </a>
</div>

</body>
</html>
